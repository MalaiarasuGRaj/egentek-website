<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found - EGenTek</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    />
    <style>
      :root {
        --background: oklch(0.995 0.002 250);
        --foreground: oklch(0.22 0.04 262);
        --muted-foreground: oklch(0.5 0.03 258);
        --primary: oklch(0.5 0.15 230);
        --primary-foreground: oklch(0.99 0 0);
        --secondary: oklch(0.96 0.01 250);
        --border: oklch(0.91 0.012 255);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --background: oklch(0.2 0.03 262);
          --foreground: oklch(0.97 0.005 250);
          --muted-foreground: oklch(0.75 0.02 255);
          --secondary: oklch(0.28 0.03 262);
          --border: oklch(0.36 0.03 262);
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Manrope", ui-sans-serif, sans-serif;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-family: "Sora", ui-sans-serif, sans-serif;
        font-size: 4.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h2 {
        margin: 1rem 0 0;
        font-family: "Sora", ui-sans-serif, sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
        color: var(--muted-foreground);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid var(--border);
      }
      a.primary {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: var(--primary);
      }
      a.secondary {
        background: var(--background);
        color: var(--foreground);
      }
      a.button:hover {
        filter: brightness(0.95);
      }
      a.button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <div class="actions">
        <a class="button primary" href="/">Go home</a>
        <a class="button secondary" href="/internships">Browse internships</a>
      </div>
    </main>
  </body>
</html>
